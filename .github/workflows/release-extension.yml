name: Release extension

on:
  push:
    tags:
      - "v*"
      - "extension-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag for this release (created if missing), e.g. extension-v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Zip the extension package
        run: bash scripts/package-extension.sh .

      - name: Attach zips to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            davflare-extension.zip
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
